# Runs on every pull request and on every push to the default branch:
# the three test suites, and check_file.py on every page that embeds the
# engine, against the known failures in scripts/ci_baseline.json.
# See scripts/ci_check.py. Standard library only, so nothing is installed.
name: checks

on:
  pull_request:
  push:
    branches: [claude/eco-interactive-graph-widgets-yrl3jz]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests, and every page against its baseline
        run: python scripts/ci_check.py
